services:
  - type: keyvalue
    name: dahan-marketpilot-state
    plan: starter
    maxmemoryPolicy: noeviction
    persistenceMode: journal-snapshot
    ipAllowList: []
  - type: web
    name: dahan-marketpilot-dashboard
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt && pip install -e .
    startCommand: streamlit run dashboard/app.py --server.address=0.0.0.0 --server.port=$PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PYTHONPATH
        value: .
      - key: MARKETPILOT_ENV
        value: paper
      - key: MARKETPILOT_CONFIG_DIR
        value: config
      - key: MARKETPILOT_TELEGRAM_ENABLED
        value: "1"
      - key: DASHBOARD_AUTH_ENABLED
        value: "false"
      - key: REDIS_URL
        fromService:
          name: dahan-marketpilot-state
          type: keyvalue
          property: connectionString
      - key: DASHBOARD_PASSWORD
        sync: false
      - key: QUANTCONNECT_USER_ID
        sync: false
      - key: QUANTCONNECT_API_TOKEN
        sync: false
      - key: QUANTCONNECT_PROJECT_ID
        sync: false
      - key: QUANTCONNECT_LIVE_DEPLOY_ID
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
  - type: worker
    name: dahan-marketpilot-scheduler
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt && pip install -e .
    startCommand: python -m marketpilot.simulation_runner scheduler
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PYTHONPATH
        value: .
      - key: MARKETPILOT_ENV
        value: simulation
      - key: MARKETPILOT_PRODUCT_MODE
        value: simulation_only
      - key: MARKETPILOT_DATA_DIR
        value: data
      - key: MARKETPILOT_SCHEDULER_CADENCE_MINUTES
        value: "5"
      - key: MARKETPILOT_SCHEDULER_STALE_AFTER_SECONDS
        value: "600"
      - key: MARKETPILOT_SCHEDULER_LOCK_TTL_SECONDS
        value: "900"
      - key: MARKETPILOT_TELEGRAM_ENABLED
        value: "1"
      - key: MARKETPILOT_RUNTIME_INPUT_KIND
        value: "none"
      - key: MARKETPILOT_OPERATOR_PAPER_PROBE_ENABLED
        value: "false"
      - key: REDIS_URL
        fromService:
          name: dahan-marketpilot-state
          type: keyvalue
          property: connectionString
      - key: QUANTCONNECT_USER_ID
        sync: false
      - key: QUANTCONNECT_API_TOKEN
        sync: false
      - key: QUANTCONNECT_PROJECT_ID
        sync: false
      - key: QUANTCONNECT_LIVE_DEPLOY_ID
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
  - type: web
    name: dahan-marketpilot-heartbeat-health
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt && pip install -e .
    startCommand: python -m marketpilot.heartbeat_health_server --host=0.0.0.0 --port=$PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PYTHONPATH
        value: .
      - key: MARKETPILOT_ENV
        value: paper
      - key: MARKETPILOT_HEALTH_MAX_AGE_SECONDS
        value: "900"
      - key: REDIS_URL
        fromService:
          name: dahan-marketpilot-state
          type: keyvalue
          property: connectionString
