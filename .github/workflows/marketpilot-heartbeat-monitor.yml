name: MarketPilot Scheduler Heartbeat Monitor

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  heartbeat-monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Check heartbeat freshness
        env:
          PYTHONPATH: .
          HEARTBEAT_HEALTH_URL: ${{ secrets.HEARTBEAT_HEALTH_URL }}
        run: |
          if [ -z "${HEARTBEAT_HEALTH_URL:-}" ]; then
            echo '{"status":"not_run","reason":"HEARTBEAT_HEALTH_URL is not configured","paper_trading_only":true,"monitor_only":true}'
            exit 2
          fi
          echo "::add-mask::$HEARTBEAT_HEALTH_URL"
          python scripts/check_scheduler_heartbeat.py --heartbeat-url "$HEARTBEAT_HEALTH_URL" --max-age-seconds 900 --timeout-seconds 20
